name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q -rs

  real-packets:
    # real fail2ban bans, a real nginx container on :8080 and real TCP
    # connections from the banned address, checked against banprobe's verdicts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: sudo apt-get update -q && sudo apt-get install -y -q fail2ban
      - run: ./tests/e2e/real_packets.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-packets
          path: e2e-out/

  readme-examples:
    # re-runs every README command and checks the recorded outputs did not change
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: ./examples/readme_examples.sh
      - run: git status --porcelain && git diff --exit-code examples/
